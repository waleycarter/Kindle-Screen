<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle FullScreen Dashboard</title>
    <meta http-equiv="refresh" content="600"> <style>
        /* 彻底清除全屏自带的白边 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 4px;
            display: flex;
            flex-direction: column;
            height: 98vh;
            overflow: hidden;
        }
        
        /* 顶部区域：零间隙、强行占满两角 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            border-bottom: 2px solid #000000;
            height: 18%;
            width: 100%;
        }
        
        /* 左上角天气：宽度对半，死贴左边 */
        .weather-box { 
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }
        .weather-img {
            height: 100%;
            width: 100%;
            object-fit: contain; /* 保持比例完美铺满左侧 */
            object-position: left center; /* 强行靠左对齐，不留空隙 */
            filter: grayscale(100%) contrast(140%); /* 墨水屏专用高对比黑白 */
        }
        
        /* 右上角纳指：宽度对半，死贴右边 */
        .nasdaq-box { 
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
        }
        .nasdaq-iframe {
            width: 100%;
            height: 110%; /* 稍微拉伸，挤掉TradingView自带的边框空隙 */
            border: none;
            filter: grayscale(100%) contrast(150%);
        }

        /* 中部：BTC 周期控制面板 */
        .nav-section {
            display: flex;
            flex-direction: column;
            margin: 6px 0;
            width: 100%;
        }
        .btn-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
            text-align: left;
            padding-left: 2px;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            margin: 0 2px;
            font-size: 15px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 底部：BTC 专属超大K线图表区 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            background-color: #ffffff;
        }
        #btc-kline-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="weather-box">
            <img class="weather-img" src="https://wttr.in/Shanghai_0pq_lang=zh-cn.png" alt="Weather">
        </div>
        
        <div class="nasdaq-box">
            <iframe class="nasdaq-iframe" src="https://s.tradingview.com/embed-widget/single-quote/?symbol=CAPITALCOM%3AUS100&theme=light&locale=zh_CN"></iframe>
        </div>
    </div>

    <div class="nav-section">
        <div class="btn-title">🪙 BTC / USDT 周期切换:</div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">Daily</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">Weekly</button>
        </div>
    </div>

    <div class="chart-section">
        <iframe id="btc-kline-iframe" src=""></iframe>
    </div>

    <script>
        var btcSymbol = "BINANCE:BTCUSDT";
        var currentInterval = "60";

        function updateBtcChart() {
            var iframe = document.getElementById('btc-kline-iframe');
            if (iframe) {
                var targetUrl = "https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=" + btcSymbol + "&interval=" + currentInterval + "&theme=light&style=1&timezone=Asia%2FShanghai";
                iframe.src = targetUrl;
            }
        }

        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            var buttons = document.querySelectorAll('.tf-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateBtcChart();
        }

        window.onload = function() {
            updateBtcChart();
        };
    </script>
</body>
</html>
