<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Dashboard Final</title>
    <meta http-equiv="refresh" content="600"> <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }
        /* 顶部区域：天气 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            height: 12%;
        }
        .weather-box { text-align: left; }
        .weather-city { font-size: 18px; font-weight: bold; }
        .weather-detail { font-size: 13px; color: #333; margin-top: 2px; }
        .time-box { text-align: right; font-size: 13px; color: #505050; line-height: 1.4; }

        /* 中部按钮区 */
        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 6px 0;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            margin: 0 3px;
            font-size: 16px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 核心图表区 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        /* CSS墨水屏专用高对比度滤镜 */
        #tv-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="weather-box">
            <div class="weather-city">📍 上海 (Shanghai)</div>
            <div class="weather-detail" id="weather-text">天气同步中...</div>
        </div>
        <div class="time-box" id="live-clock">--:--:--</div>
    </div>

    <div class="nav-section">
        <div class="btn-group">
            <button class="coin-btn active" onclick="switchAsset('BINANCE:BTCUSDT', this)">BTC</button>
            <button class="coin-btn" onclick="switchAsset('BINANCE:ETHUSDT', this)">ETH</button>
            <button class="coin-btn" onclick="switchAsset('INDEX:IXIC', this)">NASDAQ</button>
        </div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">日K</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">周K</button>
        </div>
    </div>

    <div class="chart-section">
        <iframe id="tv-iframe" src=""></iframe>
    </div>

    <script>
        // 采用老旧Kindle绝对支持的 var 语法
        var currentSymbol = "BINANCE:BTCUSDT";
        var currentInterval = "60";

        // 刷新并重组图表 URL
        function updateIframeSrc() {
            var iframe = document.getElementById('tv-iframe');
            if (iframe) {
                var targetUrl = "https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=" + currentSymbol + "&interval=" + currentInterval + "&theme=light&style=1&timezone=Asia%2FShanghai&studies=%5B%5D&widgets=%5B%5D";
                iframe.src = targetUrl;
            }
        }

        function switchAsset(symbol, btn) {
            currentSymbol = symbol;
            var buttons = document.querySelectorAll('.coin-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateIframeSrc();
        }

        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            var buttons = document.querySelectorAll('.tf-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateIframeSrc();
        }

        // 用最古老、最稳健的 XMLHttpRequest 代替 fetch，彻底解决老旧 Kindle 报错问题
        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            // 使用 wttr.in 极其精简的纯文本接口，过滤掉复杂的特殊字符
            xhr.open('GET', 'https://wttr.in/Shanghai?format=%c+%t+%C', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var resText = xhr.responseText.trim();
                        document.getElementById('weather-text').innerText = resText;
                    } else {
                        document.getElementById('weather-text').innerText = "☁️ 上海行情正常";
                    }
                }
            };
            xhr.send();
        }

        function updateClock() {
            var now = new Date();
            var timeString = now.toLocaleTimeString('zh-CN', { hour12: false });
            document.getElementById('live-clock').innerHTML = "上海时间<br>" + timeString;
        }

        // 页面加载完成后立即执行
        window.onload = function() {
            updateIframeSrc();
            fetchWeather();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(fetchWeather, 1800000); // 每半小时更新一次天气
        };
    </script>
</body>
</html>
