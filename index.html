<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Automation Pure Matrix</title>
    <meta http-equiv="refresh" content="180"> 
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 4px solid #000000; 
            text-align: center;        
            vertical-align: middle;    
            padding: 15px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 核心痛点：数字内容整体放大一倍（56px超粗体） */
        .value {
            font-size: 56px;
            font-weight: bold;
            line-height: 1.1;
        }

        .sub {
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <div class="title">📍 SHANGHAI</div>
                <div class="value" id="weather-val">24 °C</div>
                <div class="sub">REALTIME TEMP</div>
            </td>
            
            <td>
                <div class="title">🪙 BTC / USDT</div>
                <div class="value" id="btc-val">$64,208</div>
                <div class="sub">GITHUB SYNCED</div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="title">📈 NASDAQ 100</div>
                <div class="value" id="ndx-val">18,542</div>
                <div class="sub">LIVE INDEX</div>
            </td>
            
            <td>
                <div class="title">💵 USD / CNY</div>
                <div class="value" id="fx-val">7.2458</div>
                <div class="sub">FOREX RATE</div>
            </td>
        </tr>
    </table>

</body>
</html>
