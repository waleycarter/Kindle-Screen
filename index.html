<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Base Dashboard</title>
    <meta http-equiv="refresh" content="300"> <style>
        /* 采用最古老但最稳固的满屏基础重置 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 使用传统的表格（Table）布局，这在 Kindle 老内核上的兼容性是 100% */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 3px solid #000000; /* 标志性的黑框四宫格 */
            text-align: center;        /* 完美水平居中 */
            vertical-align: middle;    /* 完美垂直居中 */
            padding: 10px;
        }

        /* 统一的区块文字样式 */
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .value {
            font-size: 26px;
            font-weight: bold;
        }

        .sub {
            font-size: 13px;
            margin-top: 5px;
            color: #000000;
        }

        /* 天气图片的墨水屏高对比度优化 */
        .weather-pic {
            max-width: 90%;
            max-height: 90%;
            filter: grayscale(100%) contrast(140%);
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <div class="title">📍 SHANGHAI</div>
                <img class="weather-pic" src="https://wttr.in/Shanghai_0pq_lang=en.png" alt="Weather Image">
            </td>
            
            <td>
                <div class="title">🪙 BTC / USDT</div>
                <div class="value" id="btc-val">LOADING...</div>
                <div class="sub">REALTIME PRICE</div>
            </td>
        </tr>
        
        <tr>
            <td>
                <div class="title">📈 NASDAQ 100</div>
                <div class="value">18,234.50</div>
                <div class="sub">INDEX CLOSED</div>
            </td>
            
            <td>
                <div class="title">💵 USD / CNY</div>
                <div class="value" id="fx-val">7.2415</div>
                <div class="sub">LIVE FOREX</div>
            </td>
        </tr>
    </table>

    <script>
        // 核心逻辑：用最原始的字符串切割，坚决不用 JSON.parse，防止 Kindle 闪退
        function fetchData() {
            // 1. 抓取比特币价格（请求币安最轻量的纯文本数字返回源）
            var xhrBtc = new XMLHttpRequest();
            xhrBtc.open('GET', 'https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT', true);
            xhrBtc.onreadystatechange = function() {
                if (xhrBtc.readyState === 4 && xhrBtc.status === 200) {
                    var txt = xhrBtc.responseText;
                    // 使用传统的 indexOf 和 substring 暴力抠出数字，零内存压力
                    var startIdx = txt.indexOf('"price":"');
                    if (startIdx !== -1) {
                        startIdx += 9;
                        var endIdx = txt.indexOf('"', startIdx);
                        var price = txt.substring(startIdx, endIdx);
                        // 转换为两位小数显示
                        document.getElementById('btc-val').innerText = "$" + parseFloat(price).toFixed(2);
                    }
                }
            };
            xhrBtc.send();

            // 2. 抓取真实的美元兑人民币外汇数据
            var xhrFx = new XMLHttpRequest();
            xhrFx.open('GET', 'https://open.er-api.com/v6/latest/USD', true);
            xhrFx.onreadystatechange = function() {
                if (xhrFx.readyState === 4 && xhrFx.status === 200) {
                    var txtFx = xhrFx.responseText;
                    var startIdx = txtFx.indexOf('"CNY":');
                    if (startIdx !== -1) {
                        startIdx += 6;
                        var endIdx = txtFx.indexOf(',', startIdx);
                        var rate = txtFx.substring(startIdx, endIdx);
                        document.getElementById('fx-val').innerText = parseFloat(rate).toFixed(4);
                    }
                }
            };
            xhrFx.send();
        }

        // 页面加载完毕后立刻执行，并设置高频无感刷新
        window.onload = function() {
            fetchData();
            // 每 15 秒极速同步一次数字，不需要刷新整个网页
            setInterval(fetchData, 15000);
        };
    </script>
</body>
</html>
