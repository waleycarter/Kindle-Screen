<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle FullScreen Dashboard Borderless</title>
    <meta http-equiv="refresh" content="600"> <!-- 10分钟整页强刷清除墨水屏残影 -->
    <style>
        /* 彻底清除全屏自带的白边 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 4px;
            display: flex;
            flex-direction: column;
            height: 98vh;
            overflow: hidden;
        }
        
        /* 顶部区域：零间隙、强行占满两角 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            border-bottom: 2px solid #000000;
            height: 22%; /* 稍微拉高高度以容纳包含最高最低温的天气预报 */
            width: 100%;
            overflow: hidden; /* 裁剪掉挤出屏幕的白边 */
        }
        
        /* 左上角天气盒：通过负边距把图片自带的左侧白边吃掉 */
        .weather-box { 
            width: 52%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            margin-left: -25px; /* 核心黑魔法：把左边多余的白边拖出屏幕外 */
            margin-top: -5px;
        }
        .weather-img {
            height: 125%; /* 放大图片，挤掉上下白边 */
            object-fit: contain; 
            filter: grayscale(100%) contrast(140%); /* 墨水屏专用高对比黑白 */
        }
        
        /* 右上角纳指盒：利用拉伸和负边距把TradingView的边框空隙强行挤走 */
        .nasdaq-box { 
            width: 48%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-right: -15px; /* 核心黑魔法：把右边自带的空隙拖出屏幕外 */
        }
        .nasdaq-iframe {
            width: 115%; /* 强行拉宽小部件，使其填满右侧 */
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(150%);
        }

        /* 中部：BTC 周期控制面板 */
        .nav-section {
            display: flex;
            flex-direction: column;
            margin: 6px 0;
            width: 100%;
        }
        .btn-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
            text-align: left;
            padding-left: 2px;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            margin: 0 2px;
            font-size: 15px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 底部：BTC 专属超大K线图表区 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            background-color: #ffffff;
        }
        #btc-kline-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <!-- 顶部数据面板（纯无缝拉伸流） -->
    <div class="header-section">
        <!-- 左上角：上海天气（参数换成1，强制解锁今日天气预报，显示最高温/最低温和中文摄氏度） -->
        <div class="weather-box">
            <img class="weather-img" src="https://wttr.in/Shanghai_1pq_lang=zh-cn.png" alt="Weather">
        </div>
        
        <!-- 右上角：纳斯达克指数纯数字实时报价（通过CSS拉伸死贴右边缘） -->
        <div class="nasdaq-box">
            <iframe class="nasdaq-iframe" src="https://s.tradingview.com/embed-widget/single-quote/?symbol=CAPITALCOM%3AUS100&theme=light&locale=zh_CN"></iframe>
        </div>
    </div>

    <!-- 中部：BTC 周期触控板 -->
    <div class="nav-section">
        <div class="btn-title">🪙 BTC / USDT 周期切换:</div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">Daily</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">Weekly</button>
        </div>
    </div>

    <!-- 底部：BTC 专属 K 线主图 -->
    <div class="chart-section">
        <iframe id="btc-kline-iframe" src=""></iframe>
    </div>

    <script>
        var btcSymbol = "BINANCE:BTCUSDT";
        var currentInterval = "60";

        function updateBtcChart() {
            var iframe = document.getElementById('btc-kline-iframe');
            if (iframe) {
                var targetUrl = "https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=" + btcSymbol + "&interval=" + currentInterval + "&theme=light&style=1&timezone=Asia%2FShanghai";
                iframe.src = targetUrl;
            }
        }

        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            var buttons = document.querySelectorAll('.tf-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateBtcChart();
        }

        window.onload = function() {
            updateBtcChart();
        };
    </script>
</body>
</html>
