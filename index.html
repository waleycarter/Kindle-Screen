<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto K-Line Dashboard</title>
    <meta http-equiv="refresh" content="300"> 
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 95vh;
            overflow: hidden;
        }
        /* 顶部币种切换栏：按钮做大，方便Kindle墨水屏点击 */
        .crypto-tabs {
            display: flex;
            width: 100%;
            justify-content: space-around;
            margin-bottom: 5px;
        }
        .tab-btn {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #000000;
            color: #ffffff;
        }
        /* K线图区域 */
        .chart-container {
            width: 98%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        .chart-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* 墨水屏特殊滤镜：去除彩色，强行转为高对比度黑白，让K线更清晰 */
            filter: grayscale(100%) contrast(150%);
        }
        /* 底部时间周期切换栏 */
        .time-tabs {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-top: 5px;
        }
        .time-btn {
            background-color: #ffffff;
            border: 1px solid #000000;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
        }
        .time-btn.active {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="crypto-tabs">
        <button class="tab-btn active" onclick="changeCoin('BTCUSDT')">BTC</button>
        <button class="tab-btn" onclick="changeCoin('ETHUSDT')">ETH</button>
        <button class="tab-btn" onclick="changeCoin('SOLUSDT')">SOL</button>
    </div>

    <div class="chart-container">
        <img id="kline-chart" class="chart-img" src="" alt="K线图加载中...">
    </div>

    <div class="time-tabs">
        <button class="time-btn" onclick="changeInterval('15')">15m</button>
        <button class="time-btn active" onclick="changeInterval('60')">1h</button>
        <button class="time-btn" onclick="changeInterval('240')">4h</button>
        <button class="time-btn" onclick="changeInterval('D')">日K</button>
        <button class="time-btn" onclick="changeInterval('W')">周K</button>
    </div>

    <script>
        // 默认配置
        let currentCoin = 'BINANCE:BTCUSDT';
        let currentInterval = '60'; // 默认1小时

        function updateChart() {
            const chartImg = document.getElementById('kline-chart');
            // 时间戳，防止浏览器缓存图片不更新
            const timestamp = new Date().getTime(); 
            
            // 构建 TradingView 官方的静态图表生成接口 URL
            // theme=light(明亮模式), style=1(烛线图), width/height适配Kindle
            const imageUrl = `https://s3.tradingview.com/snapshots/${currentCoin.split(':')[1].toLowerCase()}/${currentCoin.split(':')[1].toLowerCase()}_${currentInterval}.png?${timestamp}`;
            
            // 备用高稳定性接口（如果上面官方接口国内部分地区打不开，可以用这个标准轻量图）
            const fallbackUrl = `https://charts.tradingview.com/charts/v1/embed.html?symbol=${currentCoin}&interval=${currentInterval}&theme=light&style=1`;
            
            // 直接利用高级轻量图表源
            chartImg.src = `https://image.thum.io/get/width/750/crop/600/maxAge/120/https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=${currentCoin}&interval=${currentInterval}&theme=light&style=1`;
        }

        function changeCoin(coin) {
            currentCoin = 'BINANCE:' + coin;
            // 更新按钮样式
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateChart();
        }

        function changeInterval(interval) {
            currentInterval = interval;
            // 更新按钮样式
            const buttons = document.querySelectorAll('.time-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateChart();
        }

        // 初始化加载
        updateChart();
        // 每隔 60 秒自动刷新一次当前K线图
        setInterval(updateChart, 60000);
    </script>
</body>
</html>
