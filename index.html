<script>
        function fetchPrice() {
            // 更换为国内可直连的替代行情接口（此处使用无须鉴权的公共平替接口）
            fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd')
                .then(response => response.json())
                .then(data => {
                    const price = parseFloat(data.bitcoin.usd).toFixed(2);
                    // 加上千分位逗号
                    document.getElementById('btc-price').innerText = '$' + parseFloat(price).toLocaleString('en-US', {minimumFractionDigits: 2});
                    
                    const now = new Date();
                    document.getElementById('update-time').innerText = '最后更新: ' + now.toLocaleTimeString();
                })
                .catch(err => {
                    // 如果依然失败，尝试备用接口
                    fetchBackupPrice();
                });
        }

        function fetchBackupPrice() {
            // 备用接口：Gate.io 交易所国内相对稳定的公开接口
            fetch('https://api.gateio.ws/api/v4/spot/tickers?currency_pair=BTC_USDT')
                .then(response => response.json())
                .then(data => {
                    if(data && data.length > 0) {
                        const price = parseFloat(data[0].last).toFixed(2);
                        document.getElementById('btc-price').innerText = '$' + parseFloat(price).toLocaleString('en-US', {minimumFractionDigits: 2});
                        const now = new Date();
                        document.getElementById('update-time').innerText = '最后更新(备用): ' + now.toLocaleTimeString();
                    }
                })
                .catch(err => {
                    document.getElementById('btc-price').innerText = '网络连接失败';
                });
        }

        fetchPrice();
        // 每 30 秒局部刷新一次数据
        setInterval(fetchPrice, 30000);
    </script>
