<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 4-Grid Centered Dashboard</title>
    <meta http-equiv="refresh" content="600"> <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 98vh;
            overflow: hidden;
        }

        /* 核心四宫格容器 */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 两列对开 */
            grid-template-rows: 1fr 1fr;    /* 两行对开 */
            gap: 15px; /* 四个格子之间的舒适空隙 */
            width: 100%;
            height: 100%;
        }

        /* 单个卡片格子：让所有内容在格子里绝对上下左右居中 */
        .grid-card {
            border: 2px solid #000000; /* 四宫格经典黑边框 */
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;    /* 水平居中 */
            justify-content: center;  /* 垂直居中 */
            padding: 10px;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 左上角天气专属优化：通过强制高度让今日最高最低温顶入视线 */
        .weather-wrapper {
            width: 100%;
            height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .weather-img {
            max-height: 130%; /* 稍微放大，把底部的未来几天裁掉，只留顶部今日最高低预报 */
            max-width: 100%;
            object-fit: contain;
            /* 墨水屏高对比滤镜 */
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }

        /* 右上、左下、右下角外链报价组件通用排版 */
        .widget-iframe {
            width: 95%;
            height: 90%;
            border: none;
            /* 强行干掉彩色，确保数字在 Kindle 屏幕上清晰醒目 */
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <div class="grid-card">
            <div class="weather-wrapper">
                <img class="weather-img" src="https://wttr.in/Shanghai_mC_lang=en.png" alt="Shanghai Weather Forecast">
            </div>
        </div>
        
        <div class="grid-card">
            <iframe class="widget-iframe" src="https://s.tradingview.com/embed-widget/single-quote/?symbol=BINANCE%3ABTCUSDT&theme=light&locale=en"></iframe>
        </div>

        <div class="grid-card">
            <iframe class="widget-iframe" src="https://s.tradingview.com/embed-widget/single-quote/?symbol=CAPITALCOM%3AUS100&theme=light&locale=en"></iframe>
        </div>
        
        <div class="grid-card">
            <iframe class="widget-iframe" src="https://s.tradingview.com/embed-widget/single-quote/?symbol=FX_IDC%3AUSDCNY&theme=light&locale=en"></iframe>
        </div>

    </div>

</body>
</html>
