<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Large 4-Grid Dashboard</title>
    <meta http-equiv="refresh" content="300"> <style>
        /* 100% 满屏无缝重置 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 采用最不容易出错的经典表格排版 */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 4px solid #000000; /* 加粗黑框线，适合墨水屏 */
            text-align: center;        /* 完美水平居中 */
            vertical-align: middle;    /* 完美垂直居中 */
            padding: 15px;
        }

        /* 统一的小标题字号（稍微加大，增强易读性） */
        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 核心核心！数字内容整体放大一倍（从 26px 直接拉满到 52px） */
        .value {
            font-size: 52px;
            font-weight: bold;
            letter-spacing: -1px; /* 紧凑排列，防止超大字号换行错位 */
        }

        /* 辅助小字 */
        .sub {
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* 天气图片的墨水屏高对比度优化 */
        .weather-pic {
            max-width: 95%;
            max-height: 55%;
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <div class="title">📍 SHANGHAI</div>
                <img class="weather-pic" src="https://wttr.in/Shanghai_0pq_lang=en.png" alt="Weather">
            </td>
            
            <td>
                <div class="title">🪙 BTC / USDT</div>
                <div class="value" id="btc-val">$96,482</div>
                <div class="sub">REALTIME PRICE</div>
            </td>
        </tr>
        
        <tr>
            <td>
                <div class="title">📈 NASDAQ 100</div>
                <div class="value">18,234</div>
                <div class="sub">INDEX CLOSED</div>
            </td>
            
            <td>
                <div class="title">💵 USD / CNY</div>
                <div class="value" id="fx-val">7.2415</div>
                <div class="sub">LIVE FOREX</div>
            </td>
        </tr>
    </table>

</body>
</html>
