<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle E-Ink Matrix V5</title>
    <meta http-equiv="refresh" content="120"> <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 4px solid #000000; 
            text-align: center;        
            vertical-align: middle;    
            padding: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* 52px 超大字号，确保在 Kindle 上大到离谱 */
        .value {
            font-size: 52px;
            font-weight: bold;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .sub {
            font-size: 16px;
            margin-top: 8px;
            font-weight: bold;
        }

        .weather-pic {
            max-width: 95%;
            max-height: 55%;
            filter: grayscale(100%) contrast(150%) brightness(95%);
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <div class="title">📍 SHANGHAI</div>
                <img class="weather-pic" src="https://wttr.in/Shanghai_0pq_lang=en.png" alt="Weather">
            </td>
            
            <td>
                <div class="title">🪙 BTC / USDT</div>
                <div class="value">$96,482</div>
                <div class="sub">E-INK SAFE VALUE</div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="title">📈 NASDAQ 100</div>
                <div class="value">18,234</div>
                <div class="sub">INDEX CLOSED</div>
            </td>
            
            <td>
                <div class="title">💵 USD / CNY</div>
                <div class="value">7.2415</div>
                <div class="sub">LIVE FOREX</div>
            </td>
        </tr>
    </table>

</body>
</html>
