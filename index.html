<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Matrix Box Pure Image</title>
    <meta http-equiv="refresh" content="60"> 
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 绝对兼容的表格四宫格布局 */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 4px solid #000000; /* 加粗边框，适合墨水屏 */
            text-align: center;        /* 水平完美居中 */
            vertical-align: middle;    /* 垂直完美居中 */
            padding: 10px;
            height: 50%;
            width: 50%;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* 统一缩放控制，让四个模块内的行情图片整体放大一倍居中显示 */
        .content-pic {
            max-width: 95%;
            max-height: 80%; /* 极大化利用格子空间 */
            display: inline-block;
            vertical-align: middle;
            /* 墨水屏高对比度优化：去掉杂色，让文字、曲线和数字黑白分明 */
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <div class="title">📍 SHANGHAI</div>
                <img class="content-pic" src="https://wttr.in/Shanghai_0pq_lang=en.png" alt="Weather">
            </td>
            
            <td>
                <div class="title">🪙 BTC / USDT</div>
                <img class="content-pic" src="https://s3.tradingview.com/mini-charts/side/BINANCE-BTCUSDT.svg" alt="BTC Price">
            </td>
        </tr>
        
        <tr>
            <td>
                <div class="title">📈 NASDAQ 100</div>
                <img class="content-pic" src="https://s3.tradingview.com/mini-charts/side/CURRENCYCOM-US100.svg" alt="NASDAQ Price">
            </td>
            
            <td>
                <div class="title">💵 USD / CNY</div>
                <img class="content-pic" src="https://s3.tradingview.com/mini-charts/side/FX_IDC-USDCNY.svg" alt="USDCNY Price">
            </td>
        </tr>
    </table>

</body>
</html>
