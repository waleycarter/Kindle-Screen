<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Dashboard Fix</title>
    <meta http-equiv="refresh" content="600"> <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }
        /* 顶部区域：天气 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            height: 12%;
        }
        .weather-box { text-align: left; }
        .weather-city { font-size: 18px; font-weight: bold; }
        .weather-detail { font-size: 13px; color: #333; margin-top: 2px; }
        .time-box { text-align: right; font-size: 13px; color: #505050; }

        /* 中部按钮区 */
        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 6px 0;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            margin: 0 3px;
            font-size: 16px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 核心图表区 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        /* CSS墨水屏专用滤镜：将彩色的K线转换为高对比度的纯黑白，极大提高无光墨水屏的可见度 */
        #tv-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="weather-box">
            <div class="weather-city">📍 上海 (Shanghai)</div>
            <div class="weather-detail" id="weather-text">天气同步中...</div>
        </div>
        <div class="time-box" id="live-clock">--:--:--</div>
    </div>

    <div class="nav-section">
        <div class="btn-group">
            <button class="coin-btn active" onclick="switchCoin('BINANCE:BTCUSDT', this)">BTC</button>
            <button class="coin-btn" onclick="switchCoin('BINANCE:ETHUSDT', this)">ETH</button>
            <button class="coin-btn" onclick="switchCoin('BINANCE:SOLUSDT', this)">SOL</button>
        </div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">日K</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">周K</button>
        </div>
    </div>

    <div class="chart-section">
        <iframe id="tv-iframe" src=""></iframe>
    </div>

    <script>
        // 采用最保险的古老ES5语法（var），确保旧版Kindle绝对不报错
        var currentSymbol = "BINANCE:BTCUSDT";
        var currentInterval = "60";

        // 核心：刷新并重组iframe的URL
        function updateIframeSrc() {
            var iframe = document.getElementById('tv-iframe');
            if (iframe) {
                // 直接利用官方稳定的embed嵌入页地址，隐藏一切不需要的彩色杂项，最大化图表空间
                var targetUrl = "https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=" + currentSymbol + "&interval=" + currentInterval + "&theme=light&style=1&timezone=Asia%2FShanghai&studies=%5B%5D&widgets=%5B%5D";
                iframe.src = targetUrl;
            }
        }

        function switchCoin(symbol, btn) {
            currentSymbol = symbol;
            var buttons = document.querySelectorAll('.coin-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateIframeSrc();
        }

        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            var buttons = document.querySelectorAll('.tf-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateIframeSrc();
        }

        function fetchWeather() {
            // wttr.in 免费天气源
            fetch('https://wttr.in/Shanghai?format=%c+%t+%C+湿度:%h')
                .then(function(res) { return res.text(); })
                .then(function(data) {
                    document.getElementById('weather-text').innerText = data.trim();
                })
                .catch(function() {
                    document.getElementById('weather-text').innerText = "☁️ 18°C 阴天";
                });
        }

        function updateClock() {
            var now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
        }

        // 页面加载完成后立即执行
        window.onload = function() {
            updateIframeSrc();
            fetchWeather();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(fetchWeather, 1800000); // 半小时刷新一次天气
        };
    </script>
</body>
</html>
