<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle E-Ink Dashboard V4</title>
    <meta http-equiv="refresh" content="600"> <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }
        /* 顶部区域：天气与时钟 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            height: 14%;
        }
        .weather-box { 
            width: 60%;
            height: 100%;
            display: flex;
            align-items: center;
        }
        /* 纯英文国际图片流，彻底绝交乱码 */
        .weather-img {
            max-height: 90%;
            max-width: 100%;
            object-fit: contain;
            /* 强制转换为墨水屏高对比度黑白 */
            filter: grayscale(100%) contrast(140%);
        }
        .time-box { 
            width: 35%;
            text-align: right; 
            font-size: 14px; 
            color: #000000; 
            font-weight: bold;
            line-height: 1.4; 
        }

        /* 中部按钮区 */
        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 6px 0;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            margin: 0 3px;
            font-size: 16px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 核心图表区 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        /* CSS墨水屏专用高对比度滤镜 */
        #tv-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="weather-box">
            <img class="weather-img" src="https://wttr.in/Shanghai_0pq_lang=en.png" alt="Weather">
        </div>
        <div class="time-box" id="live-clock">--:--:--</div>
    </div>

    <div class="nav-section">
        <div class="btn-group">
            <button class="coin-btn active" onclick="switchAsset('BINANCE:BTCUSDT', this)">BTC</button>
            <button class="coin-btn" onclick="switchAsset('BINANCE:ETHUSDT', this)">ETH</button>
            <button class="coin-btn" onclick="switchAsset('CAPITALCOM:US100', this)">NASDAQ</button>
        </div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">Daily</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">Weekly</button>
        </div>
    </div>

    <div class="chart-section">
        <iframe id="tv-iframe" src=""></iframe>
    </div>

    <script>
        var currentSymbol = "BINANCE:BTCUSDT";
        var currentInterval = "60";

        function updateIframeSrc() {
            var iframe = document.getElementById('tv-iframe');
            if (iframe) {
                // 使用最基础的嵌入参数，避免触发 TradingView 的高级验证
                var targetUrl = "https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=" + currentSymbol + "&interval=" + currentInterval + "&theme=light&style=1&timezone=Asia%2FShanghai";
                iframe.src = targetUrl;
            }
        }

        function switchAsset(symbol, btn) {
            currentSymbol = symbol;
            var buttons = document.querySelectorAll('.coin-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateIframeSrc();
        }

        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            var buttons = document.querySelectorAll('.tf-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateIframeSrc();
        }

        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            if (hours < 10) hours = "0" + hours;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;
            
            document.getElementById('live-clock').innerHTML = "SHANGHAI<br>" + hours + ":" + minutes + ":" + seconds;
        }

        window.onload = function() {
            updateIframeSrc();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
