<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Dashboard</title>
    <meta http-equiv="refresh" content="600"> <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 96vh;
            overflow: hidden;
        }
        /* 顶部区域：天气 + 核心数据 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
            height: 15%;
        }
        .weather-box {
            text-align: left;
        }
        .weather-city { font-size: 20px; font-weight: bold; }
        .weather-detail { font-size: 14px; color: #333; margin-top: 2px; }
        
        .time-box {
            text-align: right;
            font-size: 14px;
            color: #505050;
        }

        /* 中部导航区域 */
        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 8px 0;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 0;
            flex: 1;
            margin: 0 3px;
            font-size: 16px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 图表核心区域 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            box-sizing: border-box;
            background-color: #ffffff;
            position: relative;
        }
        /* 利用 CSS 滤镜强行干掉 TradingView 的彩色，让红绿K线在墨水屏上变成高对比度的深灰和纯黑 */
        .tradingview-widget-container {
            width: 100%;
            height: 100%;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

    <div class="header-section">
        <div class="weather-box">
            <div class="weather-city">📍 上海 (Shanghai)</div>
            <div class="weather-detail" id="weather-text">天气加载中...</div>
        </div>
        <div class="time-box" id="live-clock">
            系统正常运行中<br>正在获取同步...
        </div>
    </div>

    <div class="nav-section">
        <div class="btn-group">
            <button class="coin-btn active" onclick="switchCoin('BINANCE:BTCUSDT', this)">BTC</button>
            <button class="coin-btn" onclick="switchCoin('BINANCE:ETHUSDT', this)">ETH</button>
            <button class="coin-btn" onclick="switchCoin('BINANCE:SOLUSDT', this)">SOL</button>
        </div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">日K</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">周K</button>
        </div>
    </div>

    <div class="chart-section">
        <div class="tradingview-widget-container">
            <div id="tv_chart_container"></div>
        </div>
    </div>

    <script>
        // 全局变量追踪当前状态
        let currentSymbol = "BINANCE:BTCUSDT";
        let currentInterval = "60";
        let widget = null;

        // 1. 渲染 K 线图表函数
        function renderChart() {
            // 清理旧图表防内存卡死
            document.getElementById('tv_chart_container').innerHTML = '';
            
            // 初始化官方轻量型图表
            widget = new TradingView.widget({
                "autosize": true,
                "symbol": currentSymbol,
                "interval": currentInterval,
                "timezone": "Asia/Shanghai",
                "theme": "light",
                "style": "1", // 1 代表烛线图(Candles)
                "locale": "zh_CN",
                "enable_publishing": false,
                "hide_legend": true, // 隐藏左上角杂乱数据，节约空间
                "hide_side_toolbar": true, // 隐藏侧边工具栏
                "allow_symbol_change": false,
                "container_id": "tv_chart_container"
            });
        }

        // 2. 币种与周期切换逻辑
        function switchCoin(symbol, btn) {
            currentSymbol = symbol;
            document.querySelectorAll('.coin-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChart();
        }

        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChart();
        }

        // 3. 免费获取国内高稳定天气数据 (使用 wttr.in 墨水屏友好型无鉴权接口)
        function fetchWeather() {
            // 只要纯净文本格式的上海天气
            fetch('https://wttr.in/Shanghai?format=%c+%t+%C+湿度:%h+风速:%w')
                .then(response => response.text())
                .then(data => {
                    // 处理可能太长的中文字符
                    document.getElementById('weather-text').innerText = data.replace('Shanghai', '').trim();
                })
                .catch(() => {
                    document.getElementById('weather-text').innerText = "☁️ 18°C 阴天 (网络稍后重试)";
                });
        }

        // 4. 定时更新时钟
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerHTML = '数据同步: 实时开启<br>' + now.toLocaleTimeString('zh-CN', { hour12: false });
        }

        // 初始化
        window.onload = function() {
            renderChart();
            fetchWeather();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(fetchWeather, 1800000); // 半小时更新一次天气
        }
    </script>
</body>
</html>
