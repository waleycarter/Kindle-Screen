<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Minimal BTC & NASDAQ Dashboard</title>
    <meta http-equiv="refresh" content="600"> <!-- 10分钟整页强刷清除墨水屏残影 -->
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }
        
        /* 顶部区域：左天气，右纳指 */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            height: 16%;
        }
        
        /* 左上角天气盒 */
        .weather-box { 
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .weather-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: grayscale(100%) contrast(140%); /* 墨水屏黑白滤镜 */
        }
        
        /* 右上角纳指盒 */
        .nasdaq-box { 
            width: 45%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .nasdaq-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(150%); /* 强制变黑白数字 */
        }

        /* 中部：仅保留BTC的周期选择按钮 */
        .nav-section {
            display: flex;
            flex-direction: column;
            margin: 8px 0;
        }
        .btn-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            text-align: left;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        button {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            margin: 0 3px;
            font-size: 15px;
        }
        button.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* 底部：BTC专属超大K线图表区 */
        .chart-section {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #000000;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        #btc-kline-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(100%) contrast(160%) brightness(95%);
        }
    </style>
</head>
<body>

    <!-- 顶部数据面板 -->
    <div class="header-section">
        <!-- 左上角：上海天气（更新为中文+摄氏度公制单位图片，且优化为1行紧凑型） -->
        <div class="weather-box">
            <img class="weather-img" src="https://wttr.in/Shanghai_0pq_lang=zh-cn.png" alt="Weather">
        </div>
        
        <!-- 右上角：纳斯达克指数实时纯数字报价（无K线，省空间） -->
        <div class="nasdaq-box">
            <iframe class="nasdaq-iframe" src="https://s.tradingview.com/embed-widget/single-quote/?symbol=CAPITALCOM%3AUS100&theme=light&locale=zh_CN"></iframe>
        </div>
    </div>

    <!-- 中部：BTC 周期触控板 -->
    <div class="nav-section">
        <div class="btn-title">🪙 BTC / USDT 周期切换:</div>
        <div class="btn-group">
            <button class="tf-btn" onclick="switchTimeframe('15', this)">15m</button>
            <button class="tf-btn active" onclick="switchTimeframe('60', this)">1h</button>
            <button class="tf-btn" onclick="switchTimeframe('240', this)">4h</button>
            <button class="tf-btn" onclick="switchTimeframe('D', this)">Daily</button>
            <button class="tf-btn" onclick="switchTimeframe('W', this)">Weekly</button>
        </div>
    </div>

    <!-- 底部：BTC 专属 K 线主图 -->
    <div class="chart-section">
        <iframe id="btc-kline-iframe" src=""></iframe>
    </div>

    <script>
        // 锁定只能显示比特币
        var btcSymbol = "BINANCE:BTCUSDT";
        var currentInterval = "60";

        // 仅刷新底部的 BTC K线
        function updateBtcChart() {
            var iframe = document.getElementById('btc-kline-iframe');
            if (iframe) {
                var targetUrl = "https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=" + btcSymbol + "&interval=" + currentInterval + "&theme=light&style=1&timezone=Asia%2FShanghai";
                iframe.src = targetUrl;
            }
        }

        // 切换 K 线周期的逻辑
        function switchTimeframe(interval, btn) {
            currentInterval = interval;
            var buttons = document.querySelectorAll('.tf-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            updateBtcChart();
        }

        // 页面初始化
        window.onload = function() {
            updateBtcChart();
        };
    </script>
</body>
</html>
