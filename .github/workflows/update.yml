name: Update Kindle Dashboard Data
on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分钟自动运行一次
  workflow_dispatch: # 允许手动点击运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Fetch Live Data From Servers
      run: |
        # 1. 抓取比特币价格（改用对爬虫 100% 放行的极简纯数字网关）
        BTC_RAW=$(curl -s -A "Mozilla/5.0" "https://api1.binance.com/api/v3/ticker/price?symbol=BTCUSDT" | sed -E 's/.*"price":"([0-9.]+).*/\1/' || echo "64208")
        if [ -z "$BTC_RAW" ] || [ "$BTC_RAW" = "null" ]; then
          BTC_PRICE="$64208"
        else
          BTC_PRICE=$(printf "$%.0f" "$BTC_RAW" 2>/dev/null || echo "$64208")
        fi
        echo "BTC: $BTC_PRICE"

        # 2. 抓取真实的汇率（加入空值容错防护）
        FX_RAW=$(curl -s -A "Mozilla/5.0" "https://open.er-api.com/v6/latest/USD" | sed -E 's/.*"CNY":([0-9.]+).//' | cut -d',' -f1 || echo "7.2458")
        if [ -z "$FX_RAW" ] || [ "$FX_RAW" = "null" ]; then
          FX_RATE="7.2458"
        else
          FX_RATE=$(printf "%.4f" "$FX_RAW" 2>/dev/null || echo "7.2458")
        fi
        echo "FX: $FX_RATE"

        # 3. 抓取纳指（通过开源节点 stooq 读取 CSV 格式，彻底绕过雅虎风控）
        NDX_RAW=$(curl -s -A "Mozilla/5.0" "https://stooq.com/q/d/l/?s=^ndx&f=sd2t2ohlcv&h&e=csv" | tail -n 1)
        if [ ! -z "$NDX_RAW" ] && [[ "$NDX_RAW" == *","* ]]; then
          NDX_VAL_RAW=$(echo "$NDX_RAW" | cut -d',' -f5)
          NDX_VALUE=$(printf "%.0f" "$NDX_VAL_RAW" 2>/dev/null || echo "18542")
        else
          NDX_VALUE="18542"
        fi
        echo "NDX: $NDX_VALUE"

        # 4. 抓取上海最新天气纯数字
        WEATHER_TEMP=$(curl -s -A "Mozilla/5.0" "https://wttr.in/Shanghai?format=%t" | tr -d '+°C ' | xargs printf "%s °C" 2>/dev/null || echo "24 °C")
        if [ -z "$WEATHER_TEMP" ] || [ "$WEATHER_TEMP" = " °C" ]; then
          WEATHER_TEMP="24 °C"
        fi
        echo "Weather: $WEATHER_TEMP"

        # 5. 安全精准替换到 index.html
        sed -i -E "s/id=\"weather-val\">[^<]+/id=\"weather-val\">$WEATHER_TEMP/" index.html
        sed -i -E "s/id=\"btc-val\">[^<]+/id=\"btc-val\">$BTC_PRICE/" index.html
        sed -i -E "s/id=\"ndx-val\">[^<]+/id=\"ndx-val\">$NDX_VALUE/" index.html
        sed -i -E "s/id=\"fx-val\">[^<]+/id=\"fx-val\">$FX_RATE/" index.html

    - name: Commit and Push to Github Pages
      run: |
        git config --global user.name "Github Action Robot"
        git config --global user.email "action@github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Pure numeric bypass with null protection"
        git push
