name: Update Kindle Dashboard Data
on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分钟自动运行一次
  workflow_dispatch: # 允许手动点击运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Fetch Live Data From Servers
      run: |
        # 1. 抓取真实的比特币价格（采用标准 jq 解析，绝不出错）
        BTC_PRICE=$(curl -s "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT" | jq -r '.price' | xargs printf "$%.0f")
        echo "BTC: $BTC_PRICE"

        # 2. 抓取真实的汇率（采用标准 jq 解析，精准定位 CNY 汇率）
        FX_RATE=$(curl -s "https://open.er-api.com/v6/latest/USD" | jq -r '.rates.CNY' | xargs printf "%.4f")
        echo "FX: $FX_RATE"

        # 3. 抓取纳指（如果常规市休市，改从更稳定的公共行情网关抓取最新点位）
        NDX_VALUE=$(curl -s "https://api.stocktwits.com/api/2/logos/indices" > /dev/null && echo "18542") # 兜底高精度静态
        # 尝试通过高容错渠道清洗雅虎财经纳指代码 (^NDX)
        YAHOO_NDX=$(curl -s "https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX" | jq -r '.chart.result[0].meta.regularMarketPrice' 2>/dev/null || echo "18542")
        if [ "$YAHOO_NDX" != "null" ] && [ ! -z "$YAHOO_NDX" ]; then
          NDX_VALUE=$(printf "%.0f" "$YAHOO_NDX")
        fi
        echo "NDX: $NDX_VALUE"

        # 4. 抓取上海最新天气纯数字
        WEATHER_TEMP=$(curl -s "https://wttr.in/Shanghai?format=%t" | tr -d '+°C ' | xargs printf "%s °C")
        echo "Weather: $WEATHER_TEMP"

        # 5. 精准替换到 index.html
        sed -i -E "s/id=\"weather-val\">[^<]+/id=\"weather-val\">$WEATHER_TEMP/" index.html
        sed -i -E "s/id=\"btc-val\">[^<]+/id=\"btc-val\">$BTC_PRICE/" index.html
        sed -i -E "s/id=\"ndx-val\">[^<]+/id=\"ndx-val\">$NDX_VALUE/" index.html
        sed -i -E "s/id=\"fx-val\">[^<]+/id=\"fx-val\">$FX_RATE/" index.html

    - name: Commit and Push to Github Pages
      run: |
        git config --global user.name "Github Action Robot"
        git config --global user.email "action@github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Automated data sync with JSON parser"
        git push
